name: build-windows
on: [push, pull_request]

jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # 1) Hent OpenCPN og last ned Windows-deps (inkl. wxWidgets)
      - name: Prepare OpenCPN deps (download toolchain + wxWidgets)
        shell: cmd
        run: |
          git clone --depth 1 https://github.com/OpenCPN/OpenCPN.git
          cd OpenCPN
          buildwin\win_deps.bat
          if errorlevel 1 exit /b 1

      # 2) Finn wxWidgets-katalog og lib-mappe i cache, eksporter til GITHUB_ENV
      - name: Locate wxWidgets in cache and export env
        shell: pwsh
        run: |
          $cache = Join-Path $env:GITHUB_WORKSPACE 'OpenCPN\cache'
          if (!(Test-Path $cache)) { throw "Cache folder not found: $cache" }

          # Finn wxWidgets-<versjon>-mappe (tar den nyeste hvis flere)
          $wx = Get-ChildItem $cache -Directory -Filter 'wxWidgets-*' | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $wx) { throw "wxWidgets-* not found under $cache" }

          $root = $wx.FullName

          # Vanlige Win32 lib-stier fra win_deps.bat:
          $candidates = @(
            'lib\vc14x_dll',  # typisk for MSVC 2022 (Win32)
            'lib\vc14x_lib',
            'lib\vc14\mswud',
            'lib'
          )
          $lib = $null
          foreach ($rel in $candidates) {
            $p = Join-Path $root $rel
            if (Test-Path $p) { $lib = $p; break }
          }
          if (-not $lib) { throw "No wxWidgets lib dir found under $root" }

          "wxWidgets_ROOT_DIR=$root"     | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "wxWidgets_LIB_DIR=$lib"       | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "wxWidgets_CONFIGURATION=mswu" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "wxWidgets_ROOT_DIR=$root"
          Write-Host "wxWidgets_LIB_DIR=$lib"
          Write-Host "wxWidgets_CONFIGURATION=mswu"

      # 3) Konfigurer som Win32 (x86) og slå av i18n så vi slipper gettext
      - name: Configure (Win32)
        shell: cmd
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A Win32 -DCMAKE_GENERATOR_PLATFORM=Win32 -DCMAKE_BUILD_TYPE=Release ^
            -DwxWidgets_ROOT_DIR="%wxWidgets_ROOT_DIR%" ^
            -DwxWidgets_LIB_DIR="%wxWidgets_LIB_DIR%" ^
            -DwxWidgets_CONFIGURATION=%wxWidgets_CONFIGURATION% ^
            -DBUILD_I18N=OFF -DPLUGIN_I18N=OFF

      - name: Build
        shell: cmd
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: cmd
        run: cmake --build build --config Release --target package

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: plugin-windows
          path: build\*.tar.gz
