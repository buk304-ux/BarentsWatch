name: build-windows
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # 1) Hent OpenCPN og deps (inkl. wxWidgets)
      - name: Prepare OpenCPN deps (download toolchain + wxWidgets)
        shell: cmd
        run: |
          git clone --depth 1 https://github.com/OpenCPN/OpenCPN.git
          cd OpenCPN
          buildwin\win_deps.bat
          if errorlevel 1 exit /b 1

      # 2) Finn wxWidgets i cache og eksporter til env
      - name: Locate wxWidgets in cache and export env
        shell: pwsh
        run: |
          $cache = Join-Path $env:GITHUB_WORKSPACE 'OpenCPN\cache'
          if (!(Test-Path $cache)) { throw "Cache folder not found: $cache" }
          $wx = Get-ChildItem $cache -Directory -Filter 'wxWidgets-*' | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $wx) { throw "wxWidgets-* not found under $cache" }
          $root = $wx.FullName
          $candidates = @('lib\vc14x_dll','lib\vc14x_lib','lib\vc14\mswud','lib')
          $lib = $null
          foreach ($rel in $candidates) {
            $p = Join-Path $root $rel
            if (Test-Path $p) { $lib = $p; break }
          }
          if (-not $lib) { throw "No wxWidgets lib dir found under $root" }
          "wxWidgets_ROOT_DIR=$root"     | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "wxWidgets_LIB_DIR=$lib"       | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "wxWidgets_CONFIGURATION=mswu" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "wxWidgets_ROOT_DIR=$root"
          Write-Host "wxWidgets_LIB_DIR=$lib"
          Write-Host "wxWidgets_CONFIGURATION=mswu"

      # 3) Konfigurer som Win32 (x86). Slå av i18n for å slippe gettext-krav.
      - name: Configure (Win32)
        shell: cmd
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A Win32 -DCMAKE_GENERATOR_PLATFORM=Win32 -DCMAKE_BUILD_TYPE=Release ^
            -DwxWidgets_ROOT_DIR="%wxWidgets_ROOT_DIR%" ^
            -DwxWidgets_LIB_DIR="%wxWidgets_LIB_DIR%" ^
            -DwxWidgets_CONFIGURATION=%wxWidgets_CONFIGURATION% ^
            -DBUILD_I18N=OFF -DPLUGIN_I18N=OFF

      - name: Build
        shell: cmd
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: cmd
        run: cmake --build build --config Release --target package

      # 4) Finn tarball
      - name: Find built tarball
        shell: pwsh
        run: |
          $t = Get-ChildItem build -Filter *.tar.gz -Recurse | Select-Object -First 1
          if (-not $t) { throw "No .tar.gz found under build/" }
          "TARBALL_PATH=$($t.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Tarball: $($t.FullName)"

      # 5) Hvis metadata.xml mangler, pakk ut og gi riktig navn
      - name: Ensure metadata.xml is present (rename any *.xml to metadata.xml)
        shell: pwsh
        run: |
          $tar = $env:TARBALL_PATH
          $tmp = Join-Path $env:RUNNER_TEMP "tarfix"
          if (Test-Path $tmp) { Remove-Item $tmp -Recurse -Force }
          New-Item -ItemType Directory -Path $tmp | Out-Null
          tar -xzf $tar -C $tmp
          $meta = Get-ChildItem $tmp -Filter metadata.xml -Recurse | Select-Object -First 1
          if (-not $meta) {
            $anyxml = Get-ChildItem $tmp -Filter *.xml -Recurse | Select-Object -First 1
            if ($anyxml) {
              Rename-Item -Path $anyxml.FullName -NewName "metadata.xml"
            } else {
              throw "No XML found inside tarball to rename to metadata.xml"
            }
          }
          # repakk alt (toppnivå) til en ny tarball
          $fixed = Join-Path $env:RUNNER_TEMP "barentswatch_fixed.tar.gz"
          if (Test-Path $fixed) { Remove-Item $fixed -Force }
          tar -czf $fixed -C $tmp .
          "TARBALL_PATH=$fixed" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Repacked tarball: $fixed"

      # 6) Verifiser at metadata.xml finnes i toppnivå
      - name: Verify tarball has metadata.xml
        shell: cmd
        run: |
          tar -tzf "%TARBALL_PATH%" | findstr /R /I "^[^/]*metadata\.xml$" || (echo metadata.xml missing & exit /b 1)

      # 7) Last opp kun den riktige tarballen
      - name: Upload tarball (raw)
        uses: actions/upload-artifact@v4
        with:
          name: plugin-windows-tarball
          path: ${{ env.TARBALL_PATH }}
