name: build-windows
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # 1) Hent OpenCPN og deps (inkl. wxWidgets i cache)
      - name: Prepare OpenCPN deps (download toolchain + wxWidgets)
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/OpenCPN/OpenCPN.git
          cd OpenCPN
          & buildwin\win_deps.bat
          if ($LASTEXITCODE -ne 0) { throw "win_deps.bat failed: $LASTEXITCODE" }

      # 2) Finn wxWidgets i cache og eksporter til env
      - name: Locate wxWidgets in cache and export env
        shell: pwsh
        run: |
          $cache = Join-Path $env:GITHUB_WORKSPACE 'OpenCPN\cache'
          if (!(Test-Path $cache)) { throw "Cache folder not found: $cache" }
          $wx = Get-ChildItem $cache -Directory -Filter 'wxWidgets-*' | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $wx) { throw "wxWidgets-* not found under $cache" }
          $root = $wx.FullName
          $candidates = @('lib\vc14x_dll','lib\vc14x_lib','lib\vc14\mswud','lib')
          $lib = $null
          foreach ($rel in $candidates) {
            $p = Join-Path $root $rel
            if (Test-Path $p) { $lib = $p; break }
          }
          if (-not $lib) { throw "No wxWidgets lib dir found under $root" }
          "wxWidgets_ROOT_DIR=$root"     | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "wxWidgets_LIB_DIR=$lib"       | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "wxWidgets_CONFIGURATION=mswu" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "wxWidgets_ROOT_DIR=$root"
          Write-Host "wxWidgets_LIB_DIR=$lib"
          Write-Host "wxWidgets_CONFIGURATION=mswu"

      # 3) Gettext: prøv MSYS2, ellers lag "fake" msgfmt/msgmerge og pek CMake på dem
      - name: Install gettext tools (with fallback)
        shell: pwsh
        run: |
          choco install -y msys2
          $roots = @("C:\tools\msys64","C:\msys64")
          $msys = $roots | Where-Object { Test-Path $_ } | Select-Object -First 1
          $fmt = $null; $mer = $null
          if ($msys) {
            & "$msys\usr\bin\bash.exe" -lc "pacman -Sy --noconfirm --needed gettext"
            $fmt = Join-Path $msys "usr\bin\msgfmt.exe"
            $mer = Join-Path $msys "usr\bin\msgmerge.exe"
          }
          if (!(Test-Path $fmt) -or !(Test-Path $mer)) {
            $fake = Join-Path $env:RUNNER_TEMP "fake-gettext"
            New-Item -ItemType Directory -Path $fake | Out-Null
            $fmt = Join-Path $fake "msgfmt.cmd"
            $mer = Join-Path $fake "msgmerge.cmd"
            Set-Content -Path $fmt -Value "@echo msgfmt 0.0 (fake)`r`nexit /b 0`r`n" -Encoding ascii
            Set-Content -Path $mer -Value "@echo msgmerge 0.0 (fake)`r`nexit /b 0`r`n" -Encoding ascii
          }
          "GETTEXT_MSGFMT_EXECUTABLE=$fmt"   | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GETTEXT_MSGMERGE_EXECUTABLE=$mer" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "msgfmt:  $fmt"
          Write-Host "msgmerge: $mer"

      # 4) Configure (x64), slå av i18n, og fortell CMake hvor msgfmt/msgmerge er
      - name: Configure (x64)
        shell: pwsh
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DwxWidgets_ROOT_DIR="$env:wxWidgets_ROOT_DIR"
          -DwxWidgets_LIB_DIR="$env:wxWidgets_LIB_DIR"
          -DwxWidgets_CONFIGURATION=$env:wxWidgets_CONFIGURATION
          -DBUILD_I18N=OFF -DPLUGIN_I18N=OFF
          -DGETTEXT_MSGMERGE_EXECUTABLE="$env:GETTEXT_MSGMERGE_EXECUTABLE"
          -DGETTEXT_MSGFMT_EXECUTABLE="$env:GETTEXT_MSGFMT_EXECUTABLE"

      - name: Build tarball
        shell: pwsh
        run: cmake --build build --config Release --target tarball --parallel

      - name: Verify tarball has metadata.xml
        shell: pwsh
        run: |
          $t = Get-ChildItem -Recurse -Path build -Filter *.tar.gz | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $t) { throw "No .tar.gz produced under build/" }
          "TARBALL_PATH=$($t.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Tarball: $($t.FullName)"
          $ok = tar -tzf "$($t.FullName)" | Select-String -SimpleMatch "metadata.xml"
          if (-not $ok) {
            tar -tzf "$($t.FullName)" | Out-String | Write-Host
            throw "metadata.xml missing in tarball: $($t.Name)"
          }

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: plugin-windows-tarball
          path: ${{ env.TARBALL_PATH }}
