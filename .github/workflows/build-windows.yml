name: build-windows
on: [push, pull_request]

jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # --- OpenCPN deps (wxWidgets) ---
      - name: Prepare OpenCPN deps (wxWidgets)
        shell: cmd
        run: |
          git clone --depth 1 https://github.com/OpenCPN/OpenCPN.git
          cd OpenCPN
          call buildwin\win_deps.bat
          if errorlevel 1 exit /b 1
          call cache\wx-config.bat
          if errorlevel 1 exit /b 1
          rem Export env set by wx-config.bat
          echo wxWidgets_ROOT_DIR=%wxWidgets_ROOT_DIR%>> %GITHUB_ENV%
          echo wxWidgets_LIB_DIR=%wxWidgets_LIB_DIR%>> %GITHUB_ENV%
          echo wxWidgets_CONFIGURATION=mswu>> %GITHUB_ENV%
          echo WXWIN=%wxWidgets_ROOT_DIR%>> %GITHUB_ENV%

      - name: Show wx env (debug)
        shell: cmd
        run: |
          echo wxWidgets_ROOT_DIR=%wxWidgets_ROOT_DIR%
          echo wxWidgets_LIB_DIR=%wxWidgets_LIB_DIR%
          echo wxWidgets_CONFIGURATION=%wxWidgets_CONFIGURATION%
          if not exist "%wxWidgets_ROOT_DIR%" (echo Missing ROOT && exit /b 1)
          if not exist "%wxWidgets_LIB_DIR%"  (echo Missing LIB  && exit /b 1)

      # --- Install MSYS2 and gettext tools (msgfmt/msgmerge) ---
      - name: Install MSYS2
        shell: pwsh
        run: |
          choco install -y msys2
          $roots = @("C:\tools\msys64","C:\msys64")
          $msys = $roots | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $msys) { throw "MSYS2 not found after install." }
          # Install gettext tools in Mingw64 environment
          & "$msys\usr\bin\bash.exe" -lc "pacman -Sy --noconfirm --needed mingw-w64-x86_64-gettext-tools"
          $fmt = Join-Path $msys "mingw64\bin\msgfmt.exe"
          $mer = Join-Path $msys "mingw64\bin\msgmerge.exe"
          if (!(Test-Path $fmt) -or !(Test-Path $mer)) { throw 'Gettext tools not found after pacman install.' }
          'GETTEXT_MSGFMT_EXECUTABLE={0}' -f $fmt | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          'GETTEXT_MSGMERGE_EXECUTABLE={0}' -f $mer | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "msgfmt:  $fmt"
          Write-Host "msgmerge: $mer"

      - name: Configure (x64)
        shell: cmd
        run: |
          cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release ^
            -DwxWidgets_ROOT_DIR="%wxWidgets_ROOT_DIR%" ^
            -DwxWidgets_LIB_DIR="%wxWidgets_LIB_DIR%" ^
            -DwxWidgets_CONFIGURATION=%wxWidgets_CONFIGURATION% ^
            -DGETTEXT_MSGMERGE_EXECUTABLE="%GETTEXT_MSGMERGE_EXECUTABLE%" ^
            -DGETTEXT_MSGFMT_EXECUTABLE="%GETTEXT_MSGFMT_EXECUTABLE%"

      - name: Build
        shell: cmd
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: cmd
        run: cmake --build build --config Release --target package

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: plugin-windows
          path: build\*.tar.gz
