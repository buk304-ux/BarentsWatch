name: build-windows
on: [push, pull_request]

jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Hent OpenCPN og sett opp Windows-avhengigheter (inkl. wxWidgets)
      - name: Prepare OpenCPN deps (wxWidgets)
        shell: cmd
        run: |
          git clone --depth 1 https://github.com/OpenCPN/OpenCPN.git
          cd OpenCPN
          call buildwin\win_deps.bat
          if errorlevel 1 exit /b 1
          call cache\wx-config.bat
          if errorlevel 1 exit /b 1
          rem Eksporter variablene til neste trinn
          echo wxWidgets_ROOT_DIR=%wxWidgets_ROOT_DIR%>> %GITHUB_ENV%
          echo WXWIN=%wxWidgets_ROOT_DIR%>> %GITHUB_ENV%

      - name: Configure (x64)
        shell: cmd
        run: |
          cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DwxWidgets_ROOT_DIR=%wxWidgets_ROOT_DIR%

      - name: Build
        shell: cmd
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: cmd
        run: cmake --build build --config Release --target package

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: plugin-windows
          path: build\*.tar.gz
